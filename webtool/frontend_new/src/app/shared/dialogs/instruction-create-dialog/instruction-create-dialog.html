<p-dialog
  header="Neuer Kurs"
  [modal]="true"
  [visible]="visible()"
  (visibleChange)="visible.set($event)"
  (onShow)="onOpen()"
  [style]="{ width: '32rem' }"
>
  <form [formGroup]="form" class="avk-dialog-form">
    <div class="avk-field">
      <label>Thema</label>
      <p-select
        formControlName="topicId"
        [options]="topics()"
        optionLabel="title"
        optionValue="id"
        [filter]="true"
        filterBy="title"
        placeholder="Thema wählen"
        appendTo="body"
      />
    </div>
    <div class="avk-field">
      <label>Startdatum</label>
      <p-datepicker formControlName="startDate" dateFormat="dd.mm.yy" appendTo="body" />
    </div>
    <p-button label="Bestätigen" (onClick)="create()" [disabled]="form.invalid" />
  </form>
</p-dialog>
