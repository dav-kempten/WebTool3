<section class="avk-page">
  <div class="avk-list-toolbar">
    <p-selectButton
      [options]="partOptions"
      [ngModel]="part()"
      (onChange)="setPart($event.value)"
      optionLabel="label"
      optionValue="value"
      [allowEmpty]="false"
    />
    <span class="avk-spacer"></span>
    @if (canAdd()) {
      <p-button label="Termin hinzufügen" icon="pi pi-plus" severity="secondary" (onClick)="openCreate()" />
    }
  </div>

  <p-table
    #dt
    [value]="rows()"
    [paginator]="true"
    [rows]="20"
    [rowsPerPageOptions]="[20, 50, 100]"
    [globalFilterFields]="['reference', 'title', 'speaker']"
    dataKey="id"
    styleClass="p-datatable-sm p-datatable-striped"
  >
    <ng-template #caption>
      <div class="avk-table-caption">
        <span class="p-input-icon-left">
          <i class="pi pi-search"></i>
          <input
            pInputText
            type="text"
            maxlength="50"
            placeholder="Terminfilter"
            (input)="dt.filterGlobal($any($event.target).value, 'contains')"
          />
        </span>
        <p-select
          [options]="stateGroupOptions"
          [ngModel]="stateGroup()"
          (onChange)="stateGroup.set($event.value)"
          optionLabel="label"
          optionValue="value"
        />
      </div>
    </ng-template>

    <ng-template #header>
      <tr>
        <th>Buchungscode</th>
        <th>Bezeichnung</th>
        <th>Referent</th>
        <th>Status</th>
        <th>Aktionen</th>
      </tr>
    </ng-template>

    <ng-template #body let-row>
      <tr>
        <td (click)="select(row)" class="avk-link-cell">{{ row.reference }}</td>
        <td (click)="select(row)" class="avk-link-cell">{{ row.title }}</td>
        <td>{{ row.speaker }}</td>
        <td>{{ row.stateName }}</td>
        <td>
          <div class="avk-row-actions">
            @if (canModify(row)) {
              <p-button label="Klonen" size="small" severity="info" (onClick)="cloneRow(row)" />
            }
            @if (canDelete(row)) {
              <p-button label="Löschen" size="small" severity="danger" (onClick)="confirmDelete(row)" />
            }
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr><td colspan="5" class="avk-empty">Keine Gruppentermine gefunden.</td></tr>
    </ng-template>
  </p-table>
</section>

<p-dialog
  header="Neuer Gruppentermin"
  [modal]="true"
  [visible]="showCreate()"
  (visibleChange)="showCreate.set($event)"
  [style]="{ width: '32rem' }"
>
  <form [formGroup]="createForm" class="avk-dialog-form">
    <div class="avk-field">
      <label>Gruppe</label>
      <p-select
        formControlName="collectiveId"
        [options]="creatableCollectives()"
        optionLabel="title"
        optionValue="id"
        placeholder="Gruppe wählen"
        appendTo="body"
      />
    </div>
    <div class="avk-field">
      <label>Startdatum</label>
      <p-datepicker formControlName="startDate" dateFormat="dd.mm.yy" appendTo="body" />
    </div>
    <p-button label="Bestätigen" (onClick)="create()" [disabled]="createForm.invalid" />
  </form>
</p-dialog>
