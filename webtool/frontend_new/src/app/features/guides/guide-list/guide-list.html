<section class="avk-page">
  <p-table
    #dt
    [value]="rows()"
    [paginator]="true"
    [rows]="25"
    [rowsPerPageOptions]="[25, 50, 100]"
    [globalFilterFields]="['firstName', 'lastName', 'username']"
    dataKey="id"
    styleClass="p-datatable-sm p-datatable-striped"
  >
    <ng-template #caption>
      <div class="avk-table-caption">
        <span class="p-input-icon-left">
          <i class="pi pi-search"></i>
          <input
            pInputText
            type="text"
            maxlength="50"
            placeholder="Trainerfilter"
            (input)="dt.filterGlobal($any($event.target).value, 'contains')"
          />
        </span>
      </div>
    </ng-template>

    <ng-template #header>
      <tr>
        <th>Vorname</th>
        <th>Nachname</th>
      </tr>
    </ng-template>

    <ng-template #body let-guide>
      <tr class="avk-link-cell" (click)="select(guide)">
        <td>{{ guide.firstName }}</td>
        <td>{{ guide.lastName }}</td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr><td colspan="2" class="avk-empty">Keine Trainer gefunden.</td></tr>
    </ng-template>
  </p-table>
</section>
