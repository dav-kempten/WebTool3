<p-menubar [model]="navItems" class="avk-menubar">
  <ng-template #start>
    <a routerLink="/dashboard" class="avk-brand">
      <i class="pi pi-mountain"></i>
      <span>WebTool</span>
    </a>
    <avk-breadcrumb-bar />
  </ng-template>
  <ng-template #end>
    @if (isLoggedIn()) {
      <div class="avk-toolbar-gap">
        <span class="avk-user" [pTooltip]="'Angemeldet als ' + roleLabel()" tooltipPosition="bottom">
          <span class="avk-user-name">{{ user().firstName }} {{ user().lastName }}</span>
          @if (roleLabel()) {
            <span class="avk-user-role">{{ roleLabel() }}</span>
          }
        </span>
        <p-splitButton
          label="Abmelden"
          icon="pi pi-sign-out"
          [model]="userMenu"
          (onClick)="logout()"
          severity="secondary"
        />
      </div>
    }
  </ng-template>
</p-menubar>
