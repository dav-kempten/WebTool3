<section class="avk-page">
  <div class="avk-list-toolbar">
    <p-select
      [options]="partOptions()"
      [ngModel]="part()"
      (onChange)="setPart($event.value)"
      optionLabel="label"
      optionValue="value"
      placeholder="Alle Gruppen"
      [showClear]="true"
      [filter]="partOptions().length > 10"
      filterBy="label"
      ariaLabel="Gruppe"
    />
    <span class="avk-spacer"></span>
    @if (canAdd()) {
      <p-button label="Termin hinzufügen" icon="pi pi-plus" severity="secondary" (onClick)="openCreate()" />
    }
  </div>

  <p-table
    #dt
    [value]="rows()"
    [paginator]="true"
    [rows]="20"
    [rowsPerPageOptions]="[20, 50, 100]"
    [globalFilterFields]="['reference', 'title', 'leader']"
    dataKey="id"
    styleClass="p-datatable-sm p-datatable-striped"
  >
    <ng-template #caption>
      <div class="avk-table-caption">
        <p-iconfield iconPosition="left">
          <p-inputicon styleClass="pi pi-search" />
          <input
            pInputText
            type="text"
            maxlength="50"
            placeholder="Terminfilter"
            (input)="dt.filterGlobal($any($event.target).value, 'contains')"
          />
        </p-iconfield>
        <p-select
          [options]="stateGroupOptions"
          [ngModel]="stateGroup()"
          (onChange)="stateGroup.set($event.value)"
          optionLabel="label"
          optionValue="value"
        />
      </div>
    </ng-template>

    <ng-template #header>
      <tr>
        <th>Buchungscode</th>
        <th>Bezeichnung</th>
        <th>Leitung</th>
        <th>Status</th>
        <th>Aktionen</th>
      </tr>
    </ng-template>

    <ng-template #body let-row>
      <tr>
        <td (click)="select(row)" class="avk-link-cell">{{ row.reference }}</td>
        <td (click)="select(row)" class="avk-link-cell">{{ row.title }}</td>
        <td>{{ row.leader }}</td>
        <td>{{ row.stateName }}</td>
        <td>
          <div class="avk-row-actions">
            @if (canModify(row)) {
              <p-button label="Klonen" size="small" severity="info" (onClick)="cloneRow(row)" />
            }
            @if (canDelete(row)) {
              <p-button label="Löschen" size="small" severity="danger" (onClick)="confirmDelete(row)" />
            }
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr><td colspan="5" class="avk-empty">Keine Gruppentermine gefunden.</td></tr>
    </ng-template>
  </p-table>
</section>

<avk-session-create-dialog [(visible)]="showCreate" />
